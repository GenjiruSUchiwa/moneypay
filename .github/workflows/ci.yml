name: CI

on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The whole iOS project lives under ios/; the .xcodeproj is generated, not committed.
defaults:
  run:
    working-directory: ios

jobs:
  build-and-test:
    name: Lint, build & test (iOS 26)
    runs-on: macos-26
    env:
      DESTINATION: platform=iOS Simulator,name=iPhone 17 Pro,OS=latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.app
        working-directory: .

      - name: Install tooling
        run: brew install xcodegen swiftlint
        working-directory: .

      - name: Generate Xcode project
        run: xcodegen generate

      # Warnings are errors here too: --strict turns every SwiftLint warning
      # into a failure.
      - name: SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging

      - name: Build app
        run: |
          set -o pipefail
          xcodebuild build \
            -project MoniPay.xcodeproj \
            -scheme MoniPay \
            -destination "$DESTINATION" \
            CODE_SIGNING_ALLOWED=NO

      - name: Test app target
        run: |
          set -o pipefail
          xcodebuild test \
            -project MoniPay.xcodeproj \
            -scheme MoniPay \
            -destination "$DESTINATION" \
            CODE_SIGNING_ALLOWED=NO

      # Package tests are not in the app scheme: every SwiftPM package is
      # tested in its own directory. Add a package here when it gains tests.
      # `swift test` does not compile .xcstrings, so catalog-backed packages need xcodebuild.
      - name: Test packages
        run: |
          set -o pipefail
          for pkg in Platform Money ApiClient DesignSystem Onboarding; do
            echo "::group::$pkg"
            (cd "Packages/$pkg" && xcodebuild test \
              -scheme "$pkg" \
              -destination "$DESTINATION" \
              CODE_SIGNING_ALLOWED=NO)
            echo "::endgroup::"
          done
