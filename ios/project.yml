name: MoniPay

# XcodeGen project definition. The generated MoniPay.xcodeproj is gitignored;
# regenerate it with `xcodegen generate` from ios/.

options:
  bundleIdPrefix: com.monipay
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  # Source strings are English; the French UI copy ships as a translation in
  # String Catalogs (see docs/handoff for the localization task).
  developmentLanguage: en

# API_BASE_URL is defined here and surfaces in Info.plist under the key
# APIBaseURL (see the `info` block of the MoniPay target).
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

# Every feature and every shared capability is a local SwiftPM package.
# Inter-package dependencies live in Packages/*/Package.swift and are
# regenerated by scripts/gen-packages.py from the imports the sources use.
packages:
  Platform:
    path: Packages/Platform
  DesignSystem:
    path: Packages/DesignSystem
  Money:
    path: Packages/Money
  ApiClient:
    path: Packages/ApiClient
  WalletStore:
    path: Packages/WalletStore
  Onboarding:
    path: Packages/Onboarding
  Home:
    path: Packages/Home
  Cards:
    path: Packages/Cards
  TopUp:
    path: Packages/TopUp
  Convert:
    path: Packages/Convert
  Transactions:
    path: Packages/Transactions
  KYC:
    path: Packages/KYC
  Settings:
    path: Packages/Settings
  Gallery:
    path: Packages/Gallery

settings:
  base:
    SWIFT_VERSION: "6.0"
    # Swift 6 data-race safety, full strength.
    SWIFT_STRICT_CONCURRENCY: complete
    # Xcode 26 / Swift 6.2+: nonisolated(nonsending) by default and
    # region-based isolation. Verified supported by Xcode 26.6 (Swift.xcspec).
    SWIFT_APPROACHABLE_CONCURRENCY: "YES"
    # Unannotated code is inferred @MainActor. UI code is the overwhelming
    # majority here, so this removes annotation noise; the pieces that must run
    # off the main actor say so explicitly (`actor Wallet`, `nonisolated` on the
    # pure value types in Money, ApiClient and Platform).
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    # Warnings are errors, front and back. A warning nobody has to fix is a
    # warning everybody stops reading.
    SWIFT_TREAT_WARNINGS_AS_ERRORS: "YES"
    GCC_TREAT_WARNINGS_AS_ERRORS: "YES"
    # The generated Info.plist expands build settings such as $(API_BASE_URL).
    INFOPLIST_EXPAND_BUILD_SETTINGS: YES
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""

# Linting is deliberately not a build phase: local builds stay fast and do not
# break on a machine without SwiftLint. SwiftLint runs in CI
# (.github/workflows/ci.yml). Locally: `swiftlint lint`.
targets:
  MoniPay:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Config/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: Platform
      - package: DesignSystem
      - package: Money
      - package: ApiClient
      - package: WalletStore
      - package: Onboarding
      - package: Home
      - package: Cards
      - package: TopUp
      - package: Convert
      - package: Transactions
      - package: KYC
      - package: Settings
      - package: Gallery
    scheme:
      testTargets:
        - MoniPayTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.monipay.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: "YES"
        # Per target, not in the project base: XcodeGen's presets write "1,2"
        # onto every target, and target settings outrank project ones.
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Config/MoniPay-Info.plist
      properties:
        CFBundleDisplayName: MoniPay
        APIBaseURL: $(API_BASE_URL)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait

  # Composition-root tests only. Package logic is tested inside
  # Packages/<Name>/Tests, never here.
  MoniPayTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: MoniPay
      - package: Platform
        product: PlatformTestSupport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.monipay.app.tests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "YES"
