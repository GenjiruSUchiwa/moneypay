<meta charset="utf-8">
<script>/* thème avant peinture (anti-flash) */try{var t=localStorage.getItem("mp-theme");if(t==="dark"||t==="light")document.documentElement.dataset.theme=t}catch(e){}</script>
<title>MoniPay</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@300..800&family=Google+Sans+Code:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">

<div class="studio" id="studio">
  <nav class="rail" id="rail" aria-label="Plan des écrans">
    <div class="rail-head">
      <span id="rail-logo"></span>
      <div>
        <div class="rh-name">MoniPay</div>
        <div class="rh-sub">Refonte · prototype</div>
      </div>
    </div>
    <div class="rail-scroll" id="rail-scroll"></div>
    <div class="rail-spec">
      <div class="rail-theme" id="rail-theme"></div>
      <div class="rs-chips">
        <span class="rs-chip" style="background:#F4F5F7"></span>
        <span class="rs-chip" style="background:#12161C"></span>
        <span class="rs-chip" style="background:#053826"></span>
        <span class="rs-chip" style="background:#067647"></span>
        <span class="rs-chip" style="background:#3CDD9B"></span>
      </div>
      <div class="rs-line">Google Sans Flex · Google Sans Code<br>Clair & sombre · Vert profond · Vert vif</div>
    </div>
  </nav>
  <main class="stage">
    <div class="stage-note">Cameroun · zone CEMAC<br>Cartes virtuelles USD</div>
    <div class="device">
      <div class="screen anim" id="phone"></div>
    </div>
  </main>
  <button type="button" class="plan-fab" id="plan-fab">Plan</button>
</div>

<script src="app.js"></script>
