# git-cliff configuration for the MoniPay API changelog.
# Usage: git-cliff --config cliff.toml
# The header below is pinned: it must stay byte-identical to the top of
# CHANGELOG.md (see the release workflow).

[changelog]
header = """# Changelog

All notable changes to the MoniPay API are documented here. The format follows [Conventional Commits](https://www.conventionalcommits.org) and the project adheres to [Semantic Versioning](https://semver.org). API releases are tagged `monipay.api-v*`; the iOS app versions separately under `monipay.ios-v*`.
"""
body = """
{% if version %}## {{ version | trim_start_matches(pat="monipay.api-v") }} - {{ timestamp | date(format="%Y-%m-%d") }}{% else %}## Unreleased{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}

{% for commit in commits %}- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}
{% endfor %}{% endfor %}"""
# The blank lines above are load-bearing; trim would collapse them.
trim = false

[git]
conventional_commits = true
filter_unconventional = false
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^docs", group = "Documentation" },
  { message = "^test", group = "Testing" },
  { message = "^ci", group = "CI" },
  { message = "^build", group = "Build" },
  { message = "^chore", group = "Chores" },
]
default_group = "Other"
# Only monipay.api tags are release points; skip_tags must not match them
# (git-cliff matches it as a substring), so exclude the iOS tags instead.
tag_pattern = "monipay.api-v.*"
skip_tags = "monipay.ios-.*"
ignore_tags = ""
topo_order = false
sort_commits = "oldest"
# Commits that only touch the app tree stay out of the API changelog.
exclude_paths = ["ios/**", "prototype/**"]
