services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: monipay
      POSTGRES_USER: monipay
      POSTGRES_PASSWORD: ${MONIPAY_POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monipay -d monipay"]
      interval: 5s
      timeout: 3s
      retries: 10

  seq:
    image: datalust/seq:latest
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "127.0.0.1:5341:80"

volumes:
  postgres-data:
